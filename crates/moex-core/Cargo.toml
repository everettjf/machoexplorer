[package]
name = "moex-core"
description = "Mach-O / Fat / archive / dyld shared cache parser and view-node model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha1 = "0.10"
sha2 = "0.10"
capstone = { version = "0.14", default-features = false, features = ["full", "std", "arch_arm", "arch_arm64", "arch_x86"] }

[dev-dependencies]
flate2.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
cpp_demangle = "0.5"
