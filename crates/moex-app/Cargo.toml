[package]
name = "moex-app"
description = "MachOExplorer GUI (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "moex_app"
path = "src/lib.rs"

[[bin]]
name = "MachOExplorer"
path = "src/main.rs"

[dependencies]
moex-core.workspace = true
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
dirs = "6"
ureq = "2.12"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
tempfile = "3"
