[workspace]
resolver = "2"
members = ["crates/moex-core", "crates/moex-cli", "crates/moex-app"]
default-members = ["crates/moex-core", "crates/moex-cli"]

[workspace.package]
version = "3.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/everettjf/MachOExplorer"

[workspace.dependencies]
moex-core = { path = "crates/moex-core" }
memmap2 = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
